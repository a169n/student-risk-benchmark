feature_set_order:
  - "A_simple_oulad"
  - "B_lms_oulad"
  - "B_lms_plus_trends_oulad"
  - "B_lms_plus_mastery_oulad"
  - "B_lms_plus_indices_oulad"
  - "C_twin_oulad"

comparison:
  baseline_feature_set: "B_lms_oulad"
  candidate_feature_set: "C_twin_oulad"
  primary_split: "temporal_forward"
  improvement_rmse_tolerance: 0.05

classification_models:
  - "logistic_regression"
  - "random_forest"
  - "gradient_boosting"

regression_models:
  - "linear_regression"
  - "random_forest"
  - "gradient_boosting"

splits:
  primary: "student_group"
  secondary: "temporal_forward"
  student_group:
    test_size: 0.25
    validation_size: 0.0
    seed: 42
  temporal_forward:
    train_weeks: 20
    student_test_size: 0.25
    student_seed: 42

seed: 42

outputs:
  experiments_dir: "data/artifacts/experiments/exp_006_oulad_full_ablation"
